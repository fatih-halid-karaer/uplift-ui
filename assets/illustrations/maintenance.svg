<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img" aria-labelledby="ill-maintenance-title">
<title id="ill-maintenance-title">Down for maintenance</title>
<style>
  .ill-bg { fill: var(--subtle, #f2f5f8); }
  .ill-card { fill: var(--panel, #ffffff); stroke: var(--line, #d8e0e8); stroke-width: 1.5; stroke-linejoin: round; }
  .ill-sunken { fill: var(--sunken, #e8edf2); }
  .ill-line { fill: none; stroke: var(--line, #d8e0e8); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ill-bar { fill: var(--line, #d8e0e8); }
  .ill-ink { fill: none; stroke: var(--ink-muted, #64748b); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .ill-glow { fill: var(--highlight, rgb(47 115 224 / 0.16)); }
  .ill-accent { fill: var(--primary, #2f73e0); }
  .ill-stroke { fill: none; stroke: var(--primary, #2f73e0); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .ill-dash { fill: none; stroke: var(--primary, #2f73e0); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 7; }
  .ill-zone { fill: none; stroke: var(--line, #d8e0e8); stroke-width: 2; stroke-dasharray: 6 6; }
  .ill-on { fill: none; stroke: var(--panel, #ffffff); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .ill-success { fill: var(--success, #16a34a); }
  .ill-success-soft { fill: var(--success-soft, #dcfce7); }
  .ill-warn { fill: var(--warn, #d97706); }
  .ill-warn-soft { fill: var(--warn-soft, #fef3c7); }
  .ill-danger { fill: var(--danger, #dc2626); }
  .ill-danger-stroke { fill: none; stroke: var(--danger, #dc2626); stroke-width: 4; stroke-linecap: round; }
  .ill-info { fill: var(--info, #0284c7); }
</style>
